    <script>
      // Antes de pintar, para que no parpadee: el tema, y si es celular, táctil o app instalada (plan del celular 2.1;
      // la misma regla que web/src/movil/detectar.ts, que después sigue los cambios sin contar el teclado).
      try {
        var d = document.documentElement
        var t = localStorage.getItem('tablero.tema') || 'sistema'
        var oscuro = t === 'oscuro' || (t === 'sistema' && matchMedia('(prefers-color-scheme: dark)').matches)
        d.dataset.theme = oscuro ? 'dark' : 'light'
        var f = localStorage.getItem('telar.movil')
        var tactil = matchMedia('(pointer: coarse)').matches
        var alto = innerHeight
        var corto = Math.min(screen.width || innerWidth, screen.height || innerHeight)
        var o = screen.orientation && screen.orientation.type
        var acostada = o ? o.indexOf('landscape') === 0 : typeof window.orientation === 'number' ? Math.abs(window.orientation) === 90 : innerWidth > alto
        var movil = f ? f === 'si' : matchMedia('(max-width: 760px)').matches || (tactil && alto <= 500)
        if (movil) d.setAttribute('data-movil', '')
        if (movil && (tactil ? alto <= 500 && (innerWidth > corto + 100 || (acostada && innerWidth > alto)) : matchMedia('(orientation: landscape) and (max-height: 500px)').matches))
          d.setAttribute('data-apaisado', '')
        if (tactil) d.setAttribute('data-tactil', '')
        if (matchMedia('(display-mode: standalone)').matches || navigator.standalone === true) d.setAttribute('data-instalada', '')
        // Solo iOS: no bloquea el pellizco (iOS lo ignora) pero evita el zoom automático al escribir en una nota del lienzo.
        if (/iPad|iPhone|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1)) {
          var v = document.querySelector('meta[name=viewport]')
          v.setAttribute('content', v.getAttribute('content') + ', maximum-scale=1')
        }
      } catch (e) {}
    </script>
