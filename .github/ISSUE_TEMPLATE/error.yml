name: Algo no anda
description: Un error, algo que se rompe o se comporta raro.
labels: ["error"]
body:
  - type: markdown
    attributes:
      value: |
        Gracias por avisar. Un reporte con pasos claros se arregla mucho más rápido.
        **No pegues claves, contraseñas ni datos privados.** Si es una falla de seguridad, no uses este formulario: usá el reporte privado (ver `SECURITY.md`).
  - type: textarea
    id: que-paso
    attributes:
      label: ¿Qué pasó?
      description: "Contalo corto: qué esperabas y qué pasó en cambio."
    validations:
      required: true
  - type: textarea
    id: pasos
    attributes:
      label: Pasos para repetirlo
      placeholder: |
        1. Abrí…
        2. Tocá…
        3. Mirá que…
    validations:
      required: true
  - type: dropdown
    id: donde
    attributes:
      label: ¿Dónde lo usás?
      options:
        - En mi computadora (lo corro yo)
        - Online (un servidor mío en Vercel)
        - En un servidor alojado por otra persona
        - Desde una IA, por MCP (Claude, ChatGPT…)
    validations:
      required: true
  - type: input
    id: entorno
    attributes:
      label: Navegador y dispositivo
      placeholder: Chrome 140 en Windows, Safari en iPhone 15…
  - type: textarea
    id: extra
    attributes:
      label: Capturas o mensajes de error
      description: Podés arrastrar imágenes. Tapá lo que sea privado.
